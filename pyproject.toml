[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "crypto-address-identity"
version = "0.1.0"
description = "Evidence-first, BTC-first address identity resolver"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28,<0.29",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.12,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
cai = "crypto_address_identity.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_address_identity"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
